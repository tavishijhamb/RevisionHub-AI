<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generated Summary</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <nav>

            <div class="logo">
                <a href="index.html">
                    <h2>RevisionHub AI</h2>
                </a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>

        </nav>

    </header>

    <!-- ================= SUMMARY SECTION ================= -->

    <section class="summary-section">

        <div class="summary-container">

            <h1>AI Generated Summary</h1>

            <p class="summary-subtitle">
                Here's a concise summary of your uploaded PDF.
            </p>


            <!-- Summary Card -->

            <div class="summary-card">

                <ul class="summary-points" id="summary-list">
                </ul>

            </div>

            <!-- Buttons -->

            <div class="summary-buttons">

                <a href="#" class="secondary-btn" id="download-btn">
                    Download PDF
                </a>

                <a href="dashboard.html" class="primary-btn">
                    Back to Dashboard
                </a>

            </div>

        </div>

    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/summary.js"></script>

</body>

</html>
