<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | RevisionHub AI</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <nav>

            <div class="logo">
                <a href="index.html">
                    <h2>RevisionHub AI</h2>
                </a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>

        </nav>

    </header>

    <!-- ================= MAIN ================= -->

    <main>

        <section class="dashboard-section">

            <div class="dashboard-container">

                <h1>What would you like to generate?</h1>

                <p class="dashboard-subtitle">
                    Choose one of the AI-powered study tools below.
                </p>

                <div class="dashboard-cards">

                    <!-- Summary Card -->

                    <a href="processing-content.html?type=summary" class="study-card">

                        <div class="icon-circle">
                            <span>📝</span>
                        </div>

                        <h2>Summary</h2>

                        <p>
                            Generate concise notes from your PDF.
                        </p>

                    </a>


                    <!-- Flashcards Card -->

                    <a href="processing-content.html?type=flashcards" class="study-card">

                        <div class="icon-circle">
                            <span>🧠</span>
                        </div>

                        <h2>Flashcards</h2>

                        <p>
                            Revise important concepts quickly.
                        </p>

                    </a>


                    <!-- Quiz Card -->

                    <a href="processing-content.html?type=quiz" class="study-card">

                        <div class="icon-circle">
                            <span>🎯</span>
                        </div>

                        <h2>Quiz</h2>

                        <p>
                            Test your understanding with AI-generated questions.
                        </p>

                    </a>

                </div>

            </div>

        </section>

    </main>
    <script src="js/dashboard.js"></script>
</body>

</html>
